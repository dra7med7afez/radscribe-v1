services:
  mysql:
    image: mysql:8 # resolves to 8.4 — do NOT pass --default-authentication-plugin (removed in 8.4)
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radscribe}
      MYSQL_USER: ${MYSQL_USER:-radscribe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-radscribe}
    ports:
      # loopback-only, alternate port (a native mysqld may own 3306 on the host);
      # the API reaches mysql over the compose network — this is just for host tools
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # This compose file is the localhost development stack. The production
      # deployment uses deploy/docker-compose.prod.yml and strict secrets.
      NODE_ENV: development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    command: >
      sh -c "npx prisma migrate deploy &&
             node dist/src/main.js"

volumes:
  mysql_data:
